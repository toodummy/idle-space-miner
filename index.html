<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Idle Space Miner</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0b0620;color:#e9e3ff;font-family:"Trebuchet MS",system-ui,sans-serif;overflow:hidden}
#app{display:flex;height:100%}
#stage{position:relative;flex:1;min-height:0}
canvas{display:block;width:100%;height:100%;cursor:pointer;touch-action:manipulation}
#hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.pill{background:rgba(30,12,70,.75);border:2px solid #8a5cff;border-radius:16px;padding:6px 12px;box-shadow:0 0 12px #8a5cff88;font-weight:bold}
#crystals{font-size:22px;color:#5ff4ff;text-shadow:0 0 8px #5ff4ff}
#boostTag{color:#ff7cf5;display:none}
#panel{width:340px;background:linear-gradient(#1a0b40,#0e0628);border-left:2px solid #5ff4ff55;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
h2{font-size:15px;color:#5ff4ff;margin-top:6px;letter-spacing:1px}
button{width:100%;margin-bottom:6px;font:inherit;color:#fff;border:none;border-radius:12px;padding:10px;cursor:pointer;text-align:left;background:linear-gradient(135deg,#6a2cff,#2bb8ff);box-shadow:0 3px 0 #2a0f6a;transition:transform .05s}
button:active{transform:translateY(2px)}
button:disabled{filter:grayscale(.8) brightness(.6);cursor:not-allowed}
button small{display:block;opacity:.8;font-size:11px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
#upgrades,#drones{display:flex;flex-direction:column}
.cost{color:#ffe46b;font-weight:bold}
#adBtn{background:linear-gradient(135deg,#ff4fd8,#8a5cff)}
#prestigeBtn{background:linear-gradient(135deg,#ffb84f,#ff4f8a)}
#dailyBtn{background:linear-gradient(135deg,#2bffb8,#2b8aff)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#2a0f6a;border:2px solid #5ff4ff;padding:8px 16px;border-radius:14px;display:none;z-index:9}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:8}
#modal div{background:#1a0b40;border:2px solid #8a5cff;border-radius:18px;padding:20px;max-width:320px;text-align:center}
#modal button{margin-top:12px;text-align:center;width:100%}
.stat{font-size:12px;opacity:.85}
@media (max-width:700px){#app{flex-direction:column}#stage{flex:0 0 48%}#panel{width:100%;border-left:none;border-top:2px solid #5ff4ff55;flex:1}}
</style></head><body>
<div id="app">
 <div id="stage"><canvas id="c"></canvas>
  <div id="hud"><div class="pill"><span id="crystals">0</span> 💎<div class="stat"><span id="rate">0</span>/s · cargo <span id="cargo"></span></div></div>
  <div class="pill" style="text-align:right">⭐ x<span id="mult">1</span><div id="boostTag">2x BOOST <span id="boostT"></span>s</div></div></div>
 </div>
 <div id="panel">
  <button id="adBtn">📺 Watch ad for 2x boost (30s)<small>Rewarded ad placeholder</small></button>
  <h2>UPGRADES</h2><div id="upgrades"></div>
  <h2>DRONES</h2><div id="drones"></div>
  <h2>DAILY CHALLENGE</h2>
  <div class="stat" id="dailyInfo"></div>
  <button id="dailyBtn">📋 Share today's result<small>Copies text to clipboard</small></button>
  <h2>PRESTIGE</h2>
  <div class="stat">Warp to a new galaxy: reset progress, gain ⭐ stars. Each star = +10% income forever.</div>
  <button id="prestigeBtn"></button>
  <div class="stat" id="stats"></div>
 </div>
</div>
<div id="toast"></div>
<div id="modal"><div><div id="modalText"></div><button id="modalOk">Collect!</button></div></div>
<script>
"use strict";
// ---------- STATE ----------
const SAVE_KEY="ism_save_v1";
const UPG={
 power:{name:"⛏️ Mining Power",desc:"+1 crystal per click (scales)",base:15,growth:1.5},
 cargo:{name:"📦 Cargo Capacity",desc:"+50% storage cap",base:50,growth:1.8},
 speed:{name:"⚡ Drone Speed",desc:"Drones mine 20% faster",base:100,growth:1.7},
 auto:{name:"🤖 Auto-Miner",desc:"+2 crystals/sec passive",base:30,growth:1.35}
};
const DRONE_BASE=25,DRONE_GROWTH=1.25,DRONE_YIELD=1;
function fresh(){return{crystals:0,total:0,lvl:{power:0,cargo:0,speed:0,auto:0},drones:0,stars:0,lifetime:0,boostUntil:0,last:Date.now(),daily:{date:"",clicks:0,best:0}}}
let S=fresh();
function load(){try{const d=JSON.parse(localStorage.getItem(SAVE_KEY));if(d){S=Object.assign(fresh(),d);S.lvl=Object.assign(fresh().lvl,d.lvl);}}catch(e){console.warn("save load failed",e)}}
function save(){S.last=Date.now();try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}}
// ---------- FORMULAS ----------
const cost=k=>Math.floor(UPG[k].base*Math.pow(UPG[k].growth,S.lvl[k]));
const droneCost=()=>Math.floor(DRONE_BASE*Math.pow(DRONE_GROWTH,S.drones));
const starMult=()=>1+S.stars*0.1;
const boost=()=>Date.now()<S.boostUntil?2:1;
const mult=()=>starMult()*boost();
const clickVal=()=>(1+S.lvl.power*(1+Math.floor(S.lvl.power/10)))*mult();
const cap=()=>Math.floor(500*Math.pow(1.5,S.lvl.cargo)*starMult());
const droneRate=()=>S.drones*DRONE_YIELD*(1+0.2*S.lvl.speed);
const baseRate=()=>(S.lvl.auto*2+droneRate());
const rate=()=>baseRate()*mult();
const starsAvail=()=>Math.floor(Math.sqrt(S.total/10000));
function add(n){const before=S.crystals;S.crystals=Math.min(cap(),S.crystals+n);const g=S.crystals-before;S.total+=g;S.lifetime+=g;return g}
const fmt=n=>{n=Math.floor(n);if(n<1e4)return n.toString();const u=["K","M","B","T","Qa","Qi"];let i=-1;while(n>=1000&&i<u.length-1){n/=1000;i++}return n.toFixed(n<10?2:1)+u[i]};
// ---------- ADS (swap for CrazyGames/Poki SDK) ----------
// CrazyGames: window.CrazyGames.SDK.ad.requestAd("rewarded",{adFinished:onDone,adError:onFail})
// Poki: PokiSDK.rewardedBreak().then(ok=>ok&&onDone())
function showAd(onDone){
  toast("📺 (Placeholder ad playing...)");
  setTimeout(()=>onDone&&onDone(true),1200);
}
document.getElementById("adBtn").onclick=()=>{
  showAd(ok=>{if(ok){S.boostUntil=Math.max(Date.now(),S.boostUntil)+30000;toast("🚀 2x boost active for 30s!");save();render()}});
};
// ---------- DAILY ----------
const today=()=>new Date().toISOString().slice(0,10);
function dailyCheck(){if(S.daily.date!==today())S.daily={date:today(),clicks:0,best:0,startTotal:S.lifetime}}
function dailyMined(){return Math.max(0,S.lifetime-(S.daily.startTotal||0))}
document.getElementById("dailyBtn").onclick=async()=>{
  dailyCheck();const m=dailyMined(),goal=dailyGoal();const pct=Math.min(100,Math.floor(m/goal*100));
  const bar="🟪".repeat(Math.round(pct/10))+"⬛".repeat(10-Math.round(pct/10));
  const txt=`🚀 Idle Space Miner — Daily ${S.daily.date}\n💎 ${fmt(m)}/${fmt(goal)} crystals ${pct>=100?"✅":""}\n${bar} ${pct}%\n⛏️ ${S.daily.clicks} taps · 🤖 ${S.drones} drones\nCan you beat me?`;
  try{await navigator.clipboard.writeText(txt);toast("📋 Result copied!")}catch(e){fallbackCopy(txt)}
  window.__lastShare=txt;
};
function fallbackCopy(t){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");toast("📋 Result copied!")}catch(e){toast("Copy failed")}a.remove()}
function dailyGoal(){let h=0;for(const c of today())h=(h*31+c.charCodeAt(0))%997;return 1000+h*5}
// ---------- PRESTIGE ----------
document.getElementById("prestigeBtn").onclick=()=>{
  const g=starsAvail()-S.stars;if(g<=0)return;
  if(!confirm(`Warp galaxy? You'll reset crystals, upgrades & drones and gain ${g} ⭐.`))return;
  const keep={stars:S.stars+g,lifetime:S.lifetime,daily:S.daily,boostUntil:S.boostUntil};
  S=Object.assign(fresh(),keep);S.total=0;drones.length=0;save();buildUI();toast(`✨ Warped! +${g} stars`);
};
// ---------- UI ----------
const $=id=>document.getElementById(id);
function buildUI(){
  $("upgrades").innerHTML=Object.keys(UPG).map(k=>`<button id="u_${k}" data-k="${k}"><div class="row"><span>${UPG[k].name} <b id="l_${k}"></b></span><span class="cost" id="c_${k}"></span></div><small>${UPG[k].desc}</small></button>`).join("");
  $("drones").innerHTML=`<button id="buyDrone"><div class="row"><span>🛸 Buy Mining Drone <b id="dCount"></b></span><span class="cost" id="dCost"></span></div><small>Each drone flies out and mines ${DRONE_YIELD}/s</small></button>`;
  Object.keys(UPG).forEach(k=>$("u_"+k).onclick=()=>buy(k));
  $("buyDrone").onclick=buyDrone;
  render();
}
function buy(k){const c=cost(k);if(S.crystals<c)return;S.crystals-=c;S.lvl[k]++;save();render()}
function buyDrone(){const c=droneCost();if(S.crystals<c)return;S.crystals-=c;S.drones++;save();render()}
function render(){
  $("crystals").textContent=fmt(S.crystals);$("rate").textContent=fmt(rate()*10)/10||fmt(rate());
  $("rate").textContent=rate()<10?rate().toFixed(1):fmt(rate());
  $("cargo").textContent=fmt(cap());$("mult").textContent=mult().toFixed(1);
  const b=S.boostUntil-Date.now();$("boostTag").style.display=b>0?"block":"none";$("boostT").textContent=Math.ceil(b/1000);
  for(const k in UPG){$("l_"+k).textContent="Lv "+S.lvl[k];$("c_"+k).textContent=fmt(cost(k))+"💎";$("u_"+k).disabled=S.crystals<cost(k)}
  $("dCount").textContent="x"+S.drones;$("dCost").textContent=fmt(droneCost())+"💎";$("buyDrone").disabled=S.crystals<droneCost();
  const g=starsAvail()-S.stars;$("prestigeBtn").innerHTML=`🌌 Warp Galaxy (+${Math.max(0,g)} ⭐)<small>${g>0?"Ready!":"Mine "+fmt(Math.pow(S.stars+1,2)*10000)+" crystals this run"}</small>`;$("prestigeBtn").disabled=g<=0;
  dailyCheck();$("dailyInfo").textContent=`Today's goal: mine ${fmt(dailyGoal())} crystals — ${fmt(dailyMined())} so far (${S.daily.clicks} taps)`;
  $("stats").textContent=`Stars: ${S.stars} · Lifetime: ${fmt(S.lifetime)}`;
}
let tt;function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(tt);tt=setTimeout(()=>t.style.display="none",1800)}
// ---------- OFFLINE ----------
function offline(){
  const sec=Math.min(8*3600,(Date.now()-S.last)/1000);
  if(sec>10&&baseRate()>0){const g=add(baseRate()*starMult()*sec*0.5);if(g>0){$("modalText").innerHTML=`<h3>Welcome back, Captain! 👋</h3><p>Your drones mined while you were away (${Math.floor(sec/60)} min):</p><p style="font-size:26px;color:#5ff4ff">+${fmt(g)} 💎</p>`;$("modal").style.display="flex"}}
}
$("modalOk").onclick=()=>$("modal").style.display="none";
// ---------- CANVAS ----------
const cv=$("c"),cx=cv.getContext("2d");let W,H,DPR;
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener("resize",resize);
const stars=[...Array(120)].map(()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.6+.3,t:Math.random()*6}));
const parts=[],floats=[],drones=[];let squish=0,time=0;
const ast=()=>({x:W/2,y:H*0.55,r:Math.min(W,H)*0.2});
function hitAst(px,py){const a=ast();return Math.hypot(px-a.x,py-a.y)<a.r*1.15}
function mineClick(px,py){
  dailyCheck();S.daily.clicks++;const g=add(clickVal());squish=1;
  floats.push({x:px,y:py,v:g>0?"+"+fmt(g):"FULL!",life:1});
  for(let i=0;i<8;i++){const an=Math.random()*6.28,s=2+Math.random()*3;parts.push({x:px,y:py,vx:Math.cos(an)*s,vy:Math.sin(an)*s,life:1,c:Math.random()<.5?"#5ff4ff":"#c77dff"})}
  render();
}
cv.addEventListener("pointerdown",e=>{const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if(hitAst(x,y))mineClick(x,y)});
function syncDrones(){while(drones.length<Math.min(S.drones,30))drones.push({a:Math.random()*6.28,d:1.6+Math.random()*.8,s:.4+Math.random()*.4,ph:Math.random()*6,hue:Math.random()<.5?"#5ff4ff":"#ff7cf5",zap:0});while(drones.length>Math.min(S.drones,30))drones.pop()}
function drawAst(a){
  const s=1+Math.sin(squish*Math.PI)*0.08;cx.save();cx.translate(a.x,a.y);cx.scale(s,1/s);cx.rotate(time*0.1);
  const g=cx.createRadialGradient(-a.r*.3,-a.r*.3,a.r*.1,0,0,a.r);g.addColorStop(0,"#9b7bd6");g.addColorStop(1,"#3b2470");
  cx.shadowColor="#8a5cff";cx.shadowBlur=30;cx.fillStyle=g;cx.beginPath();
  for(let i=0;i<14;i++){const an=i/14*6.28,rr=a.r*(0.9+0.1*Math.sin(i*2.7));cx.lineTo(Math.cos(an)*rr,Math.sin(an)*rr)}cx.closePath();cx.fill();cx.shadowBlur=0;
  // crystals
  const cr=[[-.4,-.3,.25,"#5ff4ff"],[.3,-.45,.2,"#ff7cf5"],[.35,.25,.28,"#5ff4ff"],[-.25,.4,.18,"#c77dff"],[0,-.05,.22,"#7dfff0"]];
  for(const[x,y,sz,c]of cr){cx.save();cx.translate(x*a.r,y*a.r);cx.shadowColor=c;cx.shadowBlur=15+5*Math.sin(time*3+x*9);cx.fillStyle=c;const h=sz*a.r;cx.beginPath();cx.moveTo(0,-h);cx.lineTo(h*.45,0);cx.lineTo(0,h*.6);cx.lineTo(-h*.45,0);cx.closePath();cx.fill();cx.fillStyle="#fff8";cx.beginPath();cx.moveTo(0,-h);cx.lineTo(h*.15,-h*.2);cx.lineTo(-h*.1,-h*.1);cx.fill();cx.restore()}
  // cute face
  cx.fillStyle="#1a0b40";cx.beginPath();cx.arc(-a.r*.18,a.r*.05,a.r*.06,0,7);cx.arc(a.r*.18,a.r*.05,a.r*.06,0,7);cx.fill();
  cx.strokeStyle="#1a0b40";cx.lineWidth=3;cx.beginPath();cx.arc(0,a.r*.12,a.r*.1,.2,2.9);cx.stroke();
  cx.restore();
}
function drawDrone(d,a,dt){
  d.a+=dt*d.s*(1+0.2*S.lvl.speed)*0.6;const R=a.r*d.d,x=a.x+Math.cos(d.a)*R,y=a.y+Math.sin(d.a)*R*0.6+Math.sin(time*3+d.ph)*6;
  d.zap-=dt;if(d.zap<0){d.zap=1.5/(1+0.2*S.lvl.speed)+Math.random()}
  if(d.zap<0.25){const tx=a.x+(x-a.x)*0.45,ty=a.y+(y-a.y)*0.45;cx.strokeStyle=d.hue;cx.lineWidth=3;cx.shadowColor=d.hue;cx.shadowBlur=12;cx.beginPath();cx.moveTo(x,y);cx.lineTo(tx,ty);cx.stroke();cx.shadowBlur=0;if(Math.random()<.3)parts.push({x:tx,y:ty,vx:(Math.random()-.5)*3,vy:(Math.random()-.5)*3,life:.6,c:d.hue})}
  cx.save();cx.translate(x,y);const sz=Math.max(10,a.r*.14);
  cx.fillStyle="#e9e3ff";cx.shadowColor=d.hue;cx.shadowBlur=10;cx.beginPath();cx.ellipse(0,0,sz,sz*.7,0,0,7);cx.fill();cx.shadowBlur=0;
  cx.fillStyle=d.hue;cx.fillRect(-sz*1.5,-sz*.9,sz*3,sz*.25);
  cx.strokeStyle="#aaa";cx.lineWidth=2;cx.beginPath();cx.moveTo(0,-sz*.7);cx.lineTo(0,-sz*.9);cx.stroke();
  cx.fillStyle="#1a0b40";cx.beginPath();cx.ellipse(0,0,sz*.65,sz*.38,0,0,7);cx.fill();
  cx.fillStyle=d.hue;cx.beginPath();cx.arc(-sz*.25,0,sz*.12,0,7);cx.arc(sz*.25,0,sz*.12,0,7);cx.fill();
  cx.restore();
}
let lastT=performance.now(),acc=0,saveAcc=0;
function frame(t){
  const dt=Math.min(.1,(t-lastT)/1000);lastT=t;time+=dt;
  add(rate()*dt);acc+=dt;saveAcc+=dt;if(acc>.25){acc=0;render()}if(saveAcc>5){saveAcc=0;save()}
  cx.clearRect(0,0,W,H);const bg=cx.createLinearGradient(0,0,0,H);bg.addColorStop(0,"#140838");bg.addColorStop(1,"#2a0f5a");cx.fillStyle=bg;cx.fillRect(0,0,W,H);
  for(const s of stars){cx.globalAlpha=.4+.6*Math.abs(Math.sin(time+s.t));cx.fillStyle="#fff";cx.beginPath();cx.arc(s.x*W,s.y*H,s.r,0,7);cx.fill()}cx.globalAlpha=1;
  cx.fillStyle="#ff7cf555";cx.beginPath();cx.arc(W*.85,H*.2,Math.min(W,H)*.07,0,7);cx.fill();
  syncDrones();const a=ast();squish=Math.max(0,squish-dt*5);
  const back=drones.filter(d=>Math.sin(d.a)<0),front=drones.filter(d=>Math.sin(d.a)>=0);
  back.forEach(d=>drawDrone(d,a,dt));drawAst(a);front.forEach(d=>drawDrone(d,a,dt));
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.life-=dt*1.5;if(p.life<=0){parts.splice(i,1);continue}cx.globalAlpha=p.life;cx.fillStyle=p.c;cx.fillRect(p.x-2,p.y-2,4,4)}
  cx.font="bold 20px Trebuchet MS";cx.textAlign="center";
  for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.y-=40*dt;f.life-=dt;if(f.life<=0){floats.splice(i,1);continue}cx.globalAlpha=f.life;cx.fillStyle="#5ff4ff";cx.fillText(f.v,f.x,f.y)}
  cx.globalAlpha=1;
  if(S.crystals>=cap()){cx.fillStyle="#ffe46b";cx.font="bold 16px Trebuchet MS";cx.fillText("CARGO FULL — upgrade Cargo Capacity!",W/2,H-20)}
  requestAnimationFrame(frame);
}
// ---------- BOOT ----------
load();resize();buildUI();offline();save();
addEventListener("visibilitychange",()=>{if(document.hidden)save()});addEventListener("beforeunload",save);
requestAnimationFrame(frame);
window.__game={get S(){return S},mineClick,save,ast};
</script></body></html>
